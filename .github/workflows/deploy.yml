name: Production Deployment Workflow

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Build & Deploy Production Assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: cd frontend && npm install

      - name: Run Test Suite
        run: cd frontend && npm run test

      - name: Build Next.js Production Export
        run: cd frontend && npm run build

      - name: Validate Deployment Artifacts
        run: |
          echo "Validating deployment bundle..."
          test -d frontend/.next || (echo "Build output directory missing!" && exit 1)
          echo "Production deployment build verified successfully."
